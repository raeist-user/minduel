<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Minduel — Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                colors: {
                    'app-bg': '#0D0D0D',
                    'card-bg': '#1A1A1A',
                    'input-bg': '#1A1A1A',
                    'accent-green': '#A3E635',
                    'text-primary': '#FFFFFF',
                    'text-secondary': '#888888',
                    'border-color': '#2A2A2A'
                }
            }
        }
    }
</script>
<style>
    body { background-color: #0D0D0D; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; margin: 0; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 4px; }
    .input-glow:focus { box-shadow: 0 0 0 1px #A3E635; border-color: #A3E635; }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
</style>
</head>
<body>

<div class="w-full min-h-screen bg-app-bg p-8 flex flex-col justify-center mx-auto">

    <div class="text-left mb-10 mt-8 sm:mt-0 max-w-[400px] w-full mx-auto">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-8 h-8 rounded bg-card-bg flex items-center justify-center border border-border-color">
                <div class="w-4 h-4 bg-accent-green rounded-sm transform rotate-45"></div>
            </div>
            <h1 class="text-xl font-bold tracking-wide text-text-primary">MINDUEL</h1>
        </div>
        <h2 class="text-3xl font-bold tracking-tight text-text-primary mb-2">Ready to duel?</h2>
        <p class="text-sm text-text-secondary">Live 1v1 analytical problem-solving. Log in or create an account to jump into a match.</p>
    </div>

    <div class="max-w-[400px] w-full mx-auto">
        <div class="flex bg-card-bg border border-border-color rounded-xl p-1 gap-1 mb-6">
            <button id="tab-login" onclick="switchTab('login')"
                class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 bg-[#242424] text-accent-green">Log in</button>
            <button id="tab-register" onclick="switchTab('register')"
                class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 text-text-secondary hover:text-text-primary">Register</button>
        </div>

        <div id="form-error" class="hidden text-xs text-red-400 bg-red-400/10 border border-red-400/30 rounded-lg px-3 py-2.5 mb-4"></div>
        <div id="form-success" class="hidden text-xs text-accent-green bg-accent-green/10 border border-accent-green/30 rounded-lg px-3 py-2.5 mb-4"></div>

        <!-- Login -->
        <form id="panel-login" class="form-panel active" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Email or Username</label>
                <input id="login-id" required autocomplete="username"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30">
            </div>
            <div class="mb-2">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Password</label>
                <input id="login-password" type="password" required autocomplete="current-password"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30 tracking-widest font-mono">
            </div>
            <div class="text-right mb-6">
                <a href="/forgot-password.html" class="text-[11px] font-medium text-text-secondary hover:text-accent-green transition-colors duration-200 uppercase tracking-widest">Forgot password?</a>
            </div>
            <button type="submit" id="login-submit"
                class="w-full bg-accent-green text-app-bg font-bold py-4 rounded-xl hover:bg-opacity-90 transition-all duration-200 shadow-[0_0_15px_rgba(163,230,53,0.3)]">
                <span id="login-btn-text">LOG IN</span>
            </button>
        </form>

        <!-- Register -->
        <form id="panel-register" class="form-panel" onsubmit="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Username</label>
                <input id="reg-username" required minlength="3" maxlength="20" autocomplete="username"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30">
            </div>
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Email</label>
                <input id="reg-email" type="email" required autocomplete="email"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30">
            </div>
            <div class="mb-8">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Password</label>
                <input id="reg-password" type="password" required minlength="6" autocomplete="new-password"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30 tracking-widest font-mono">
                <p class="text-[11px] text-text-secondary mt-2">At least 6 characters.</p>
            </div>
            <button type="submit" id="register-submit"
                class="w-full bg-accent-green text-app-bg font-bold py-4 rounded-xl hover:bg-opacity-90 transition-all duration-200 shadow-[0_0_15px_rgba(163,230,53,0.3)]">
                <span id="register-btn-text">CREATE ACCOUNT</span>
            </button>
        </form>
    </div>

    <footer class="text-center pb-6 pt-10">
        <p class="text-[10px] text-text-secondary/60 tracking-wide">© 2026 Minduel. All rights reserved.</p>
    </footer>
</div>

<script>
    if (localStorage.getItem('minduel_token')) {
        window.location.href = '/home.html';
    }

    // Deep-link support: /index.html?tab=register or ?reset=success
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') switchTab('register');
    if (params.get('reset') === 'success') showSuccess('Password reset. You can log in now.');

    function switchTab(name) {
        document.getElementById('tab-login').className =
            'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 ' +
            (name === 'login' ? 'bg-[#242424] text-accent-green' : 'text-text-secondary hover:text-text-primary');
        document.getElementById('tab-register').className =
            'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 ' +
            (name === 'register' ? 'bg-[#242424] text-accent-green' : 'text-text-secondary hover:text-text-primary');
        document.getElementById('panel-login').classList.toggle('active', name === 'login');
        document.getElementById('panel-register').classList.toggle('active', name === 'register');
        hideMessages();
    }

    function showError(msg) {
        hideMessages();
        const el = document.getElementById('form-error');
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function showSuccess(msg) {
        hideMessages();
        const el = document.getElementById('form-success');
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function hideMessages() {
        document.getElementById('form-error').classList.add('hidden');
        document.getElementById('form-success').classList.add('hidden');
    }

    async function postJSON(url, body) {
        let res;
        try {
            res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
        } catch (networkErr) {
            throw new Error('Could not reach the server. Check your connection and try again.');
        }
        let data;
        try {
            data = await res.json();
        } catch (parseErr) {
            throw new Error(`Server returned an unexpected response (status ${res.status}).`);
        }
        if (!res.ok) throw new Error(data.message || `Request failed (status ${res.status})`);
        return data;
    }

    function onAuthSuccess(data) {
        localStorage.setItem('minduel_token', data.token);
        localStorage.setItem('minduel_user', JSON.stringify(data.user));
        window.location.href = '/home.html';
    }

    async function handleLogin(e) {
        e.preventDefault();
        hideMessages();
        const btn = document.getElementById('login-submit');
        const text = document.getElementById('login-btn-text');
        btn.disabled = true;
        text.textContent = 'Logging in...';
        try {
            const data = await postJSON('/api/auth/login', {
                emailOrUsername: document.getElementById('login-id').value.trim(),
                password: document.getElementById('login-password').value,
            });
            onAuthSuccess(data);
        } catch (err) {
            showError(err.message);
            btn.disabled = false;
            text.textContent = 'LOG IN';
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        hideMessages();
        const btn = document.getElementById('register-submit');
        const text = document.getElementById('register-btn-text');
        btn.disabled = true;
        text.textContent = 'Creating account...';
        try {
            const data = await postJSON('/api/auth/register', {
                username: document.getElementById('reg-username').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                password: document.getElementById('reg-password').value,
            });
            onAuthSuccess(data);
        } catch (err) {
            showError(err.message);
            btn.disabled = false;
            text.textContent = 'CREATE ACCOUNT';
        }
    }
</script>
</body>
</html>
