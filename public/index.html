<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Minduel — Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                colors: {
                    'app-bg': '#0D0D0D',
                    'card-bg': '#1A1A1A',
                    'input-bg': '#1A1A1A',
                    'accent-green': '#A3E635',
                    'text-primary': '#FFFFFF',
                    'text-secondary': '#888888',
                    'border-color': '#2A2A2A'
                }
            }
        }
    }
</script>
<style>
    body { background-color: #0D0D0D; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; margin: 0; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 4px; }
    .input-glow:focus { box-shadow: 0 0 0 1px #A3E635; border-color: #A3E635; }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
</style>
</head>
<body>

<div class="w-full min-h-screen bg-app-bg p-8 flex flex-col justify-center mx-auto">

    <div class="text-left mb-10 mt-8 sm:mt-0 max-w-[400px] w-full mx-auto">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-8 h-8 rounded bg-card-bg flex items-center justify-center border border-border-color">
                <div class="w-4 h-4 bg-accent-green rounded-sm transform rotate-45"></div>
            </div>
            <h1 class="text-xl font-bold tracking-wide text-text-primary">MINDUEL</h1>
        </div>
        <h2 class="text-3xl font-bold tracking-tight text-text-primary mb-2">Ready to duel?</h2>
        <p class="text-sm text-text-secondary">Live 1v1 analytical problem-solving. Log in or create an account to jump into a match.</p>
    </div>

    <div class="max-w-[400px] w-full mx-auto">
        <div class="flex bg-card-bg border border-border-color rounded-xl p-1 gap-1 mb-6">
            <button id="tab-login" onclick="switchTab('login')"
                class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 bg-[#242424] text-accent-green">Log in</button>
            <button id="tab-register" onclick="switchTab('register')"
                class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 text-text-secondary hover:text-text-primary">Register</button>
        </div>

        <div id="form-error" class="hidden text-xs text-red-400 bg-red-400/10 border border-red-400/30 rounded-lg px-3 py-2.5 mb-4"></div>
        <div id="form-success" class="hidden text-xs text-accent-green bg-accent-green/10 border border-accent-green/30 rounded-lg px-3 py-2.5 mb-4"></div>

        <!-- Login -->
        <form id="panel-login" class="form-panel active" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Email or Username</label>
                <input id="login-id" required autocomplete="username"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30">
            </div>
            <div class="mb-2">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Password</label>
                <input id="login-password" type="password" required autocomplete="current-password"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30 tracking-widest font-mono">
            </div>
            <div class="text-right mb-6">
                <a href="/forgot-password.html" class="text-[11px] font-medium text-text-secondary hover:text-accent-green transition-colors duration-200 uppercase tracking-widest">Forgot password?</a>
            </div>
            <button type="submit" id="login-submit"
                class="w-full bg-accent-green text-app-bg font-bold py-4 rounded-xl hover:bg-opacity-90 transition-all duration-200 shadow-[0_0_15px_rgba(163,230,53,0.3)]">
                <span id="login-btn-text">LOG IN</span>
            </button>
        </form>

        <!-- Register -->
        <form id="panel-register" class="form-panel" onsubmit="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Username</label>
                <input id="reg-username" required minlength="3" maxlength="20" autocomplete="username"
                    autocapitalize="none" spellcheck="false"
                    oninput="onFieldInput('username')"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30">
                <p id="reg-username-status" class="text-[11px] mt-2 pl-1 min-h-[16px] text-text-secondary">3-20 letters, numbers or underscores.</p>
            </div>
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Email</label>
                <input id="reg-email" type="email" required autocomplete="email"
                    oninput="onFieldInput('email')"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30">
                <p id="reg-email-status" class="text-[11px] mt-2 pl-1 min-h-[16px] text-text-secondary"></p>
            </div>
            <div class="mb-5">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Password</label>
                <input id="reg-password" type="password" required minlength="6" autocomplete="new-password"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30 tracking-widest font-mono">
                <p class="text-[11px] text-text-secondary mt-2">At least 6 characters.</p>
            </div>
            <label class="flex items-start gap-3 mb-8 pl-1 cursor-pointer">
                <input id="reg-terms" type="checkbox" required class="mt-0.5 w-4 h-4 shrink-0 accent-[#A3E635] cursor-pointer">
                <span class="text-[12px] leading-relaxed text-text-secondary">I am at least 13 years old and I agree to the
                    <a href="/terms.html" target="_blank" rel="noopener" class="text-accent-green underline">Terms of Service</a> and
                    <a href="/privacy.html" target="_blank" rel="noopener" class="text-accent-green underline">Privacy Policy</a>.</span>
            </label>
            <button type="submit" id="register-submit"
                class="w-full bg-accent-green text-app-bg font-bold py-4 rounded-xl hover:bg-opacity-90 transition-all duration-200 shadow-[0_0_15px_rgba(163,230,53,0.3)] disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
                <span id="register-btn-text">CREATE ACCOUNT</span>
            </button>
        </form>
    </div>

    <footer class="text-center pb-6 pt-10">
        <p class="text-[10px] text-text-secondary/60 tracking-wide">© 2026 Minduel. All rights reserved.</p>
    </footer>
</div>

<script>
    if (localStorage.getItem('minduel_token')) {
        window.location.href = '/home.html';
    }

    // Deep-link support: /index.html?tab=register or ?reset=success
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') switchTab('register');
    if (params.get('reset') === 'success') showSuccess('Password reset. You can log in now.');

    // Set by the app when a session ends for a reason the person should know
    // about (banned, suspended, or signed out after a password change).
    const notice = sessionStorage.getItem('minduel_notice');
    if (notice) {
        sessionStorage.removeItem('minduel_notice');
        showError(notice);
    }

    function switchTab(name) {
        document.getElementById('tab-login').className =
            'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 ' +
            (name === 'login' ? 'bg-[#242424] text-accent-green' : 'text-text-secondary hover:text-text-primary');
        document.getElementById('tab-register').className =
            'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-150 ' +
            (name === 'register' ? 'bg-[#242424] text-accent-green' : 'text-text-secondary hover:text-text-primary');
        document.getElementById('panel-login').classList.toggle('active', name === 'login');
        document.getElementById('panel-register').classList.toggle('active', name === 'register');
        hideMessages();
    }

    function showError(msg) {
        hideMessages();
        const el = document.getElementById('form-error');
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function showSuccess(msg) {
        hideMessages();
        const el = document.getElementById('form-success');
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function hideMessages() {
        document.getElementById('form-error').classList.add('hidden');
        document.getElementById('form-success').classList.add('hidden');
    }

    async function postJSON(url, body) {
        let res;
        try {
            res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
        } catch (networkErr) {
            throw new Error('Could not reach the server. Check your connection and try again.');
        }
        let data;
        try {
            data = await res.json();
        } catch (parseErr) {
            throw new Error(`Server returned an unexpected response (status ${res.status}).`);
        }
        if (!res.ok) {
            const err = new Error(data.message || `Request failed (status ${res.status})`);
            err.field = data.field;
            err.data = data;
            throw err;
        }
        return data;
    }

    function onAuthSuccess(data) {
        localStorage.setItem('minduel_token', data.token);
        localStorage.setItem('minduel_user', JSON.stringify(data.user));
        window.location.href = '/home.html';
    }

    // ---------- Live availability check (register form) ----------
    const USERNAME_RE = /^[A-Za-z0-9_]{3,20}$/;
    const EMAIL_RE = /^\S+@\S+\.\S+$/;
    const DEBOUNCE_MS = 400;

    // field -> 'idle' | 'checking' | 'ok' | 'bad'
    const fieldState = { username: 'idle', email: 'idle' };
    const timers = {};
    const requestSeq = { username: 0, email: 0 };

    const fieldEls = {
        username: { input: () => document.getElementById('reg-username'), status: () => document.getElementById('reg-username-status') },
        email:    { input: () => document.getElementById('reg-email'),    status: () => document.getElementById('reg-email-status') },
    };

    function setFieldStatus(field, state, message) {
        fieldState[field] = state;
        const el = fieldEls[field].status();
        const input = fieldEls[field].input();
        const colors = { idle: 'text-text-secondary', checking: 'text-text-secondary', ok: 'text-accent-green', bad: 'text-red-400' };
        el.className = 'text-[11px] mt-2 pl-1 min-h-[16px] ' + colors[state];
        el.textContent = message;
        input.style.borderColor = state === 'bad' ? '#F87171' : state === 'ok' ? '#A3E635' : '';
    }

    function onFieldInput(field) {
        clearTimeout(timers[field]);
        requestSeq[field]++; // invalidate any in-flight response for older text
        const value = fieldEls[field].input().value.trim();

        if (!value) {
            setFieldStatus(field, 'idle', field === 'username' ? '3-20 letters, numbers or underscores.' : '');
            return;
        }

        // Cheap local checks first: no network call for obviously invalid input.
        if (field === 'username' && !USERNAME_RE.test(value)) {
            const msg = value.length < 3
                ? 'Keep typing — at least 3 characters.'
                : 'Only letters, numbers and underscores (3-20 characters).';
            setFieldStatus(field, value.length < 3 ? 'idle' : 'bad', msg);
            return;
        }
        if (field === 'email' && !EMAIL_RE.test(value)) {
            setFieldStatus(field, 'idle', '');
            return;
        }

        setFieldStatus(field, 'checking', 'Checking...');
        timers[field] = setTimeout(() => checkAvailability(field, value), DEBOUNCE_MS);
    }

    async function checkAvailability(field, value) {
        const seq = ++requestSeq[field];
        try {
            const res = await fetch('/api/auth/check-availability?' + new URLSearchParams({ [field]: value }));
            if (res.status === 429) {
                if (seq === requestSeq[field]) setFieldStatus(field, 'idle', 'Checking paused — you can still submit.');
                return;
            }
            const data = await res.json();
            if (seq !== requestSeq[field]) return; // a newer keystroke superseded this reply
            const r = data[field];
            if (!r) return setFieldStatus(field, 'idle', '');
            setFieldStatus(field, r.available ? 'ok' : 'bad', r.message);
        } catch (e) {
            // Network hiccup: don't block the user. The server re-checks on submit.
            if (seq === requestSeq[field]) setFieldStatus(field, 'idle', '');
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        hideMessages();
        const btn = document.getElementById('login-submit');
        const text = document.getElementById('login-btn-text');
        btn.disabled = true;
        text.textContent = 'Logging in...';
        try {
            const data = await postJSON('/api/auth/login', {
                emailOrUsername: document.getElementById('login-id').value.trim(),
                password: document.getElementById('login-password').value,
            });
            onAuthSuccess(data);
        } catch (err) {
            let msg = err.message;
            if (err.data && err.data.code === 'SUSPENDED' && err.data.until) {
                msg += ' It ends ' + new Date(err.data.until).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + '.';
            }
            showError(msg);
            btn.disabled = false;
            text.textContent = 'LOG IN';
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        hideMessages();

        if (fieldState.username === 'bad' || fieldState.email === 'bad') {
            showError('Please fix the highlighted fields before continuing.');
            return;
        }
        if (fieldState.username === 'checking' || fieldState.email === 'checking') {
            showError('Still checking availability — one second.');
            return;
        }

        if (!document.getElementById('reg-terms').checked) {
            showError('Please confirm you are at least 13 and accept the Terms and Privacy Policy.');
            return;
        }

        const btn = document.getElementById('register-submit');
        const text = document.getElementById('register-btn-text');
        btn.disabled = true;
        text.textContent = 'Creating account...';
        try {
            const data = await postJSON('/api/auth/register', {
                username: document.getElementById('reg-username').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                password: document.getElementById('reg-password').value,
                acceptTerms: true,
            });
            onAuthSuccess(data);
        } catch (err) {
            // Someone may have grabbed the name between the live check and submit.
            if (err.field === 'username' || err.field === 'email') {
                setFieldStatus(err.field, 'bad', err.message);
            }
            showError(err.message);
            btn.disabled = false;
            text.textContent = 'CREATE ACCOUNT';
        }
    }
</script>
</body>
</html>
