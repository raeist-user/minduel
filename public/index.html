<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minduel — Sign in</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Minduel</h1>
      <p class="subtitle">Analytical duels, live, 1v1.</p>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log in</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div class="form-error" id="form-error"></div>

      <!-- Login -->
      <form class="form-panel active" id="panel-login" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="login-id">Email or username</label>
          <input id="login-id" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn-primary" type="submit" id="login-submit">Log in</button>
      </form>

      <!-- Register -->
      <form class="form-panel" id="panel-register" onsubmit="handleRegister(event)">
        <div class="field">
          <label for="reg-username">Username</label>
          <input id="reg-username" autocomplete="username" minlength="3" maxlength="20" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" autocomplete="new-password" minlength="6" required />
        </div>
        <button class="btn-primary" type="submit" id="register-submit">Create account</button>
      </form>
    </div>
  </div>

<script>
  // If already logged in, skip straight to home
  if (localStorage.getItem('minduel_token')) {
    window.location.href = '/home.html';
  }

  function switchTab(name) {
    document.getElementById('tab-login').classList.toggle('active', name === 'login');
    document.getElementById('tab-register').classList.toggle('active', name === 'register');
    document.getElementById('panel-login').classList.toggle('active', name === 'login');
    document.getElementById('panel-register').classList.toggle('active', name === 'register');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('form-error');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function hideError() {
    document.getElementById('form-error').classList.remove('visible');
  }

  async function postJSON(url, body) {
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (networkErr) {
      throw new Error('Could not reach the server. Check your connection and try again.');
    }

    let data;
    try {
      data = await res.json();
    } catch (parseErr) {
      throw new Error(`Server returned an unexpected response (status ${res.status}).`);
    }

    if (!res.ok) {
      throw new Error(data.message || `Request failed (status ${res.status})`);
    }
    return data;
  }

  function onAuthSuccess(data) {
    localStorage.setItem('minduel_token', data.token);
    localStorage.setItem('minduel_user', JSON.stringify(data.user));
    window.location.href = '/home.html';
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideError();
    const btn = document.getElementById('login-submit');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    try {
      const data = await postJSON('/api/auth/login', {
        emailOrUsername: document.getElementById('login-id').value.trim(),
        password: document.getElementById('login-password').value,
      });
      onAuthSuccess(data);
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    hideError();
    const btn = document.getElementById('register-submit');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    try {
      const data = await postJSON('/api/auth/register', {
        username: document.getElementById('reg-username').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
      });
      onAuthSuccess(data);
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  }
</script>
</body>
</html>
