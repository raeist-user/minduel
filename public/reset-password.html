<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Minduel — Reset password</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                colors: {
                    'app-bg': '#0D0D0D', 'card-bg': '#1A1A1A', 'input-bg': '#1A1A1A',
                    'accent-green': '#A3E635', 'text-primary': '#FFFFFF',
                    'text-secondary': '#888888', 'border-color': '#2A2A2A'
                }
            }
        }
    }
</script>
<style>
    body { background-color: #0D0D0D; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; margin: 0; }
    .input-glow:focus { box-shadow: 0 0 0 1px #A3E635; border-color: #A3E635; }
</style>
</head>
<body>
<div class="w-full min-h-screen bg-app-bg p-8 flex flex-col justify-center mx-auto">
    <div class="max-w-[400px] w-full mx-auto">
        <h2 class="text-3xl font-bold tracking-tight text-text-primary mb-2">Set a new password</h2>
        <p class="text-sm text-text-secondary mb-8" id="subtitle">Choose a new password for your account.</p>

        <div id="form-error" class="hidden text-xs text-red-400 bg-red-400/10 border border-red-400/30 rounded-lg px-3 py-2.5 mb-4"></div>

        <form id="reset-form" onsubmit="handleSubmit(event)">
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">New password</label>
                <input id="password" type="password" required minlength="6" autocomplete="new-password"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30 tracking-widest font-mono">
            </div>
            <div class="mb-8">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Confirm new password</label>
                <input id="confirm" type="password" required minlength="6" autocomplete="new-password"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30 tracking-widest font-mono">
            </div>
            <button type="submit" id="submit-btn"
                class="w-full bg-accent-green text-app-bg font-bold py-4 rounded-xl hover:bg-opacity-90 transition-all duration-200 shadow-[0_0_15px_rgba(163,230,53,0.3)]">
                <span id="submit-text">RESET PASSWORD</span>
            </button>
        </form>

        <p class="text-center mt-6">
            <a href="/index.html" class="text-[11px] font-medium text-text-secondary hover:text-accent-green transition-colors duration-200 uppercase tracking-widest">Back to login</a>
        </p>
    </div>
</div>

<script>
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
        document.getElementById('reset-form').classList.add('hidden');
        document.getElementById('subtitle').textContent = 'This reset link is missing its token.';
        const err = document.getElementById('form-error');
        err.textContent = 'Invalid reset link. Please request a new one.';
        err.classList.remove('hidden');
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const errorEl = document.getElementById('form-error');
        errorEl.classList.add('hidden');

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (password !== confirm) {
            errorEl.textContent = "Passwords don't match.";
            errorEl.classList.remove('hidden');
            return;
        }

        const btn = document.getElementById('submit-btn');
        const text = document.getElementById('submit-text');
        btn.disabled = true;
        text.textContent = 'Resetting...';

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Something went wrong');

            window.location.href = '/index.html?reset=success';
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
            btn.disabled = false;
            text.textContent = 'RESET PASSWORD';
        }
    }
</script>
</body>
</html>
