<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aptiks — Forgot password</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                colors: {
                    'app-bg': '#0D0D0D', 'card-bg': '#1A1A1A', 'input-bg': '#1A1A1A',
                    'accent': '#E2B714',       // Monkeytype yellow
                    'online': '#4ADE80',       // presence dots + success text 'text-primary': '#FFFFFF',
                    'text-secondary': '#888888', 'border-color': '#2A2A2A'
                }
            }
        }
    }
</script>
<style>
    body { background-color: #0D0D0D; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; margin: 0; }
    .input-glow:focus { box-shadow: 0 0 0 1px #E2B714; border-color: #E2B714; }
</style>
</head>
<body>
<div class="w-full min-h-screen bg-app-bg p-8 flex flex-col justify-center mx-auto">
    <div class="max-w-[400px] w-full mx-auto">
        <a href="/index.html" class="text-xs font-semibold text-text-secondary hover:text-text-primary transition-colors duration-150">&larr; Back to login</a>

        <h2 class="text-3xl font-bold tracking-tight text-text-primary mb-2 mt-6">Forgot password?</h2>
        <p class="text-sm text-text-secondary mb-8">Enter the email on your account and we'll send you a link to reset it.</p>

        <div id="form-error" class="hidden text-xs text-red-400 bg-red-400/10 border border-red-400/30 rounded-lg px-3 py-2.5 mb-4"></div>
        <div id="form-success" class="hidden text-xs text-accent bg-accent/10 border border-accent/30 rounded-lg px-3 py-2.5 mb-4"></div>

        <form id="forgot-form" onsubmit="handleSubmit(event)">
            <div class="mb-6">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-widest mb-2 pl-1">Email</label>
                <input id="email" type="email" required autocomplete="email"
                    class="w-full bg-input-bg border border-border-color text-text-primary text-base rounded-xl px-4 py-3.5 outline-none transition-all duration-200 input-glow placeholder:text-text-secondary/30">
            </div>
            <button type="submit" id="submit-btn"
                class="w-full bg-accent text-app-bg font-bold py-4 rounded-xl hover:bg-opacity-90 transition-all duration-200 shadow-[0_0_15px_rgba(226,183,20,0.3)]">
                <span id="submit-text">SEND RESET LINK</span>
            </button>
        </form>
    </div>
</div>

<script>
    async function handleSubmit(e) {
        e.preventDefault();
        const errorEl = document.getElementById('form-error');
        const successEl = document.getElementById('form-success');
        errorEl.classList.add('hidden');
        successEl.classList.add('hidden');

        const btn = document.getElementById('submit-btn');
        const text = document.getElementById('submit-text');
        btn.disabled = true;
        text.textContent = 'Sending...';

        try {
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Something went wrong');

            successEl.textContent = data.message || 'If that email exists, a reset link has been sent.';
            successEl.classList.remove('hidden');
            document.getElementById('forgot-form').reset();
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            text.textContent = 'SEND RESET LINK';
        }
    }
</script>
</body>
</html>
