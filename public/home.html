<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Minduel — Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                colors: {
                    'app-bg': '#0D0D0D', 'card-bg': '#1A1A1A',
                    'accent-green': '#A3E635', 'text-primary': '#FFFFFF',
                    'text-secondary': '#888888', 'border-color': '#2A2A2A'
                }
            }
        }
    }
</script>
<style>
    html { height: 100%; overscroll-behavior: none; }
    body { background-color: #0D0D0D; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 4px; }
    .btn-press:active { transform: scale(.97); }
    .dropdown { display: none; }
    .dropdown.open { display: block; }
</style>
</head>
<body>
<div class="h-full flex flex-col overflow-hidden">

    <!-- NAV -->
    <nav class="z-50 flex-shrink-0 flex items-center justify-between px-5 h-[58px] bg-app-bg/90 backdrop-blur-md border-b border-border-color">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded bg-card-bg flex items-center justify-center border border-border-color">
                <div class="w-3 h-3 bg-accent-green rounded-sm transform rotate-45"></div>
            </div>
            <span class="text-base font-semibold tracking-tight">Minduel</span>
        </div>
        <div class="relative">
            <button id="profile-btn" onclick="toggleDropdown()" class="flex items-center gap-2 pl-1.5 pr-3 py-1 rounded-full border border-border-color bg-card-bg hover:border-accent-green/50 transition-colors duration-150">
                <span id="nav-avatar" class="w-7 h-7 rounded-full text-app-bg flex items-center justify-center text-xs font-bold flex-shrink-0">?</span>
                <span id="nav-name" class="text-sm font-semibold">...</span>
            </button>
            <div id="dropdown" class="dropdown absolute right-0 top-[calc(100%+8px)] w-52 bg-card-bg border border-border-color rounded-xl overflow-hidden">
                <button onclick="openProfile()" class="w-full flex items-center gap-2.5 px-4 py-3 text-left text-sm font-medium hover:bg-white/5 transition-colors duration-150">
                    <i data-lucide="user" class="w-4 h-4 text-text-secondary shrink-0"></i>Profile
                </button>
                <div class="h-px bg-border-color"></div>
                <button onclick="logout()" class="w-full flex items-center gap-2.5 px-4 py-3 text-left text-sm font-medium text-red-400 hover:bg-white/5 transition-colors duration-150">
                    <i data-lucide="log-out" class="w-4 h-4 shrink-0"></i>Log out
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="max-w-[520px] w-full mx-auto px-5 py-6 flex flex-col flex-1 overflow-y-auto" style="overscroll-behavior: contain">

        <!-- HOME SECTION -->
        <div id="section-home">
            <h1 class="text-4xl font-bold tracking-tight mb-1">Home</h1>
            <p class="text-text-secondary mb-8">Welcome, <span id="welcome-name">...</span></p>
            <div class="bg-card-bg border border-border-color rounded-xl p-6 text-center">
                <i data-lucide="hammer" class="w-6 h-6 text-text-secondary mx-auto mb-3"></i>
                <p class="text-sm text-text-secondary">Matchmaking and the game screen are coming next. Your account is ready to go.</p>
            </div>
        </div>

        <!-- PROFILE SECTION -->
        <div id="section-profile" class="hidden">
            <button onclick="closeProfile()" class="btn-press flex items-center gap-1 text-xs font-semibold text-text-secondary hover:text-text-primary mb-6 transition-colors duration-150 -ml-1 px-1 py-1">
                <i data-lucide="chevron-left" class="w-3.5 h-3.5 shrink-0"></i>Home
            </button>

            <div class="flex items-center gap-4 mb-8">
                <div id="profile-avatar-big" class="w-16 h-16 rounded-full text-app-bg flex items-center justify-center text-xl font-bold flex-shrink-0">?</div>
                <div class="min-w-0">
                    <div id="profile-display-name" class="text-lg font-bold truncate">...</div>
                    <div class="text-xs text-text-secondary truncate"><span id="profile-email">...</span> · @<span id="profile-username">...</span></div>
                    <div class="text-xs text-accent-green mt-0.5" id="profile-rating"></div>
                </div>
            </div>

            <div id="profile-menu" class="flex flex-col gap-2"></div>
            <div id="profile-content" class="hidden">
                <button onclick="closeCategory()" class="btn-press flex items-center gap-1 text-xs font-semibold text-text-secondary hover:text-text-primary mb-4 transition-colors duration-150 -ml-1 px-1 py-1">
                    <i data-lucide="chevron-left" class="w-3.5 h-3.5 shrink-0"></i>Categories
                </button>
                <div id="profile-body"></div>
            </div>
        </div>
    </main>
</div>

<script>
    const token = localStorage.getItem('minduel_token');
    if (!token) window.location.href = '/index.html';

    const AVATAR_COLORS = ['#A3E635', '#38BDF8', '#F472B6', '#FB923C', '#C084FC', '#F87171', '#2DD4BF', '#FACC15'];
    let currentUser = null;

    async function authedFetch(url, options = {}) {
        const res = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token,
                ...(options.headers || {}),
            },
        });
        if (res.status === 401) {
            localStorage.removeItem('minduel_token');
            localStorage.removeItem('minduel_user');
            window.location.href = '/index.html';
            throw new Error('Session expired');
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Request failed');
        return data;
    }

    function renderUser(user) {
        currentUser = user;
        const initial = (user.displayName || user.username).charAt(0).toUpperCase();
        const name = user.displayName || user.username;

        document.getElementById('nav-avatar').textContent = initial;
        document.getElementById('nav-avatar').style.background = user.avatarColor;
        document.getElementById('nav-name').textContent = name;
        document.getElementById('welcome-name').textContent = name;

        document.getElementById('profile-avatar-big').textContent = initial;
        document.getElementById('profile-avatar-big').style.background = user.avatarColor;
        document.getElementById('profile-display-name').textContent = name;
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-username').textContent = user.username;
        document.getElementById('profile-rating').textContent = `Rating: ${user.rating}`;
    }

    (async function init() {
        try {
            const data = await authedFetch('/api/auth/me');
            renderUser(data.user);
            localStorage.setItem('minduel_user', JSON.stringify(data.user));
            lucide.createIcons();
        } catch (err) {
            console.error(err);
        }
    })();

    function toggleDropdown() {
        document.getElementById('dropdown').classList.toggle('open');
    }
    document.addEventListener('click', (e) => {
        const menu = document.getElementById('profile-btn');
        const dropdown = document.getElementById('dropdown');
        if (!menu.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.remove('open');
        }
    });

    function openProfile() {
        document.getElementById('dropdown').classList.remove('open');
        document.getElementById('section-home').classList.add('hidden');
        document.getElementById('section-profile').classList.remove('hidden');
        renderProfileMenu();
        closeCategory();
    }
    function closeProfile() {
        document.getElementById('section-profile').classList.add('hidden');
        document.getElementById('section-home').classList.remove('hidden');
    }

    const CATEGORIES = [
        { id: 'personalize', icon: 'palette', label: 'Personalize', desc: 'Display name & avatar color' },
        { id: 'account', icon: 'lock', label: 'Account', desc: 'Change password' },
    ];

    function renderProfileMenu() {
        document.getElementById('profile-menu').innerHTML = CATEGORIES.map(c => `
            <button onclick="openCategory('${c.id}')" class="btn-press w-full flex items-center gap-3 bg-card-bg border border-border-color rounded-xl px-4 py-3.5 text-left hover:border-accent-green/50 transition-colors duration-150">
                <span class="w-9 h-9 rounded-lg bg-white/5 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="${c.icon}" class="w-4 h-4 text-text-secondary"></i>
                </span>
                <span class="flex-1 min-w-0">
                    <span class="block text-sm font-semibold">${c.label}</span>
                    <span class="block text-xs text-text-secondary truncate">${c.desc}</span>
                </span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-text-secondary flex-shrink-0"></i>
            </button>`).join('');
        lucide.createIcons();
    }

    function openCategory(cat) {
        document.getElementById('profile-menu').classList.add('hidden');
        document.getElementById('profile-content').classList.remove('hidden');
        const body = document.getElementById('profile-body');
        if (cat === 'personalize') body.innerHTML = buildPersonalizeHTML();
        else body.innerHTML = buildAccountHTML();
        lucide.createIcons();
    }
    function closeCategory() {
        document.getElementById('profile-content').classList.add('hidden');
        document.getElementById('profile-menu').classList.remove('hidden');
    }

    // ── Personalize ──────────────────────────────────────────
    let draftColor = null;

    function buildPersonalizeHTML() {
        draftColor = currentUser.avatarColor;
        return `
        <div class="bg-card-bg border border-border-color rounded-xl p-4 mb-4">
            <label class="text-xs text-text-secondary block mb-2">Display name</label>
            <input id="pz-displayname" type="text" maxlength="30" value="${escapeHtml(currentUser.displayName || currentUser.username)}"
                class="w-full bg-app-bg border border-border-color rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-accent-green mb-4">

            <label class="text-xs text-text-secondary block mb-2">Avatar color</label>
            <div id="color-swatches" class="flex flex-wrap gap-2">${swatchesHTML()}</div>
        </div>
        <div id="pz-error" class="hidden text-xs text-red-400 mb-3"></div>
        <button onclick="savePersonalize()" id="pz-save-btn"
            class="btn-press w-full bg-accent-green text-app-bg font-bold text-sm py-3 rounded-xl shadow-[0_0_15px_rgba(163,230,53,0.25)]">
            Save changes
        </button>`;
    }

    function swatchesHTML() {
        return AVATAR_COLORS.map(c => `
            <button onclick="pickColor('${c}')" class="w-8 h-8 rounded-full border-2 transition-all duration-150"
                style="background:${c}; border-color: ${draftColor === c ? '#FFFFFF' : 'transparent'};"></button>
        `).join('');
    }

    function pickColor(c) {
        draftColor = c;
        document.getElementById('color-swatches').innerHTML = swatchesHTML();
    }

    async function savePersonalize() {
        const errEl = document.getElementById('pz-error');
        errEl.classList.add('hidden');
        const btn = document.getElementById('pz-save-btn');
        const displayName = document.getElementById('pz-displayname').value.trim();

        if (!displayName) {
            errEl.textContent = 'Display name cannot be empty.';
            errEl.classList.remove('hidden');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
            const data = await authedFetch('/api/auth/profile', {
                method: 'PATCH',
                body: JSON.stringify({ displayName, avatarColor: draftColor }),
            });
            renderUser(data.user);
            localStorage.setItem('minduel_user', JSON.stringify(data.user));
            closeCategory();
            lucide.createIcons();
        } catch (err) {
            errEl.textContent = err.message;
            errEl.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save changes';
        }
    }

    // ── Account (password + logout) ──────────────────────────
    function buildAccountHTML() {
        return `
        <div class="bg-card-bg border border-border-color rounded-xl p-4 mb-4">
            <div class="text-sm font-semibold mb-3">Change password</div>
            <label class="text-xs text-text-secondary block mb-1">Current password</label>
            <input id="pw-current" type="password" class="w-full bg-app-bg border border-border-color rounded-lg px-3 py-2.5 text-sm mb-3 focus:outline-none focus:border-accent-green">
            <label class="text-xs text-text-secondary block mb-1">New password</label>
            <input id="pw-new" type="password" placeholder="Min 6 characters" class="w-full bg-app-bg border border-border-color rounded-lg px-3 py-2.5 text-sm mb-3 focus:outline-none focus:border-accent-green">
            <label class="text-xs text-text-secondary block mb-1">Confirm new</label>
            <input id="pw-confirm" type="password" class="w-full bg-app-bg border border-border-color rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-accent-green">
        </div>
        <div id="pw-error" class="hidden text-xs text-red-400 mb-2"></div>
        <div id="pw-success" class="hidden text-xs text-accent-green mb-2"></div>
        <button onclick="savePassword()" id="pw-save-btn"
            class="btn-press w-full bg-accent-green text-app-bg font-bold text-sm py-3 rounded-xl shadow-[0_0_15px_rgba(163,230,53,0.25)] mb-4">
            Update password
        </button>

        <button onclick="logout()" class="btn-press w-full flex items-center gap-2.5 bg-card-bg border border-border-color rounded-xl px-4 py-3.5 text-left text-red-400 hover:bg-white/5 transition-colors duration-150">
            <i data-lucide="log-out" class="w-4 h-4 shrink-0"></i><span class="text-sm font-semibold">Sign out</span>
        </button>`;
    }

    async function savePassword() {
        const errEl = document.getElementById('pw-error');
        const okEl = document.getElementById('pw-success');
        errEl.classList.add('hidden');
        okEl.classList.add('hidden');

        const current = document.getElementById('pw-current').value;
        const next = document.getElementById('pw-new').value;
        const confirm = document.getElementById('pw-confirm').value;

        if (!current || !next || !confirm) {
            errEl.textContent = 'Fill in all three fields.';
            errEl.classList.remove('hidden');
            return;
        }
        if (next !== confirm) {
            errEl.textContent = "New password and confirmation don't match.";
            errEl.classList.remove('hidden');
            return;
        }

        const btn = document.getElementById('pw-save-btn');
        btn.disabled = true;
        btn.textContent = 'Updating...';
        try {
            await authedFetch('/api/auth/password', {
                method: 'PATCH',
                body: JSON.stringify({ currentPassword: current, newPassword: next }),
            });
            okEl.textContent = 'Password updated.';
            okEl.classList.remove('hidden');
            document.getElementById('pw-current').value = '';
            document.getElementById('pw-new').value = '';
            document.getElementById('pw-confirm').value = '';
        } catch (err) {
            errEl.textContent = err.message;
            errEl.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Update password';
        }
    }

    function logout() {
        localStorage.removeItem('minduel_token');
        localStorage.removeItem('minduel_user');
        window.location.href = '/index.html';
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
